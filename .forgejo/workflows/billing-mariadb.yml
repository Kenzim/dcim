# Optional: billing phase 1 and phase 2 migrations on MariaDB 11.8.
#
# Runs tests/core/test_alembic_fresh_mariadb.py (the whole Alembic chain,
# phase 1 included, from an empty database),
# tests/migrations/test_billing_p1_mariadb.py (up, down, up of the
# billing_p1_* chain), tests/migrations/test_billing_p2_mariadb.py (up, down,
# up of the billing phase 2 chain, with data present),
# tests/services/test_billing_p2_tax_publish_mariadb.py (a tax rule superseded
# during a publish), the snapshot isolation connect hook test,
# tests/services/test_billing_p1i_numbering_mariadb.py (series counters under
# concurrency), tests/services/test_billing_p1i_settlement_mariadb.py (two
# payments settling one invoice at once) and
# tests/services/test_billing_p1c_credit_mariadb.py (credit applied to an
# invoice under concurrency), tests/services/test_tax_pack_import_mariadb.py
# (a tax pack import and a publish locking the same rules wait instead of
# deadlocking) and tests/services/test_billing_p2_exchange_rates_mariadb.py (an
# exchange rate deleted or stored twice during a publish) against a mariadb:11.8
# service container, the
# version production runs. Manual trigger only, so it never blocks other work;
# the SQLite migration tests in tests/migrations run in the normal test suite.
name: Billing migrations (MariaDB)

on:
  workflow_dispatch:

jobs:
  mariadb:
    runs-on: docker
    container:
      image: python:3.11-bookworm
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rackflow-ci
          MARIADB_DATABASE: rackflow_test
    env:
      RACKFLOW_TEST_MARIADB_URL: mysql+pymysql://root:rackflow-ci@mariadb:3306/rackflow_test
      DATABASE_URL: "sqlite:///:memory:"
      INITIAL_ADMIN_USERNAME: ""
      INITIAL_ADMIN_PASSWORD: ""
      REQUIRE_SERVICE_INSTANCE_ENCRYPTION: "false"
      MCP_ENABLED: "false"
      CLIENT_MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for MariaDB
        run: |
          python - <<'EOF'
          import time, pymysql
          for _ in range(60):
              try:
                  pymysql.connect(host="mariadb", user="root", password="rackflow-ci").close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MariaDB did not start")
          EOF
      - name: Whole migration chain from an empty database on MariaDB
        run: python -m pytest tests/core/test_alembic_fresh_mariadb.py -q
      - name: Billing phase 1 chain on MariaDB
        run: python -m pytest tests/migrations/test_billing_p1_mariadb.py tests/core/test_database_snapshot_isolation.py -q
      - name: Series counters under concurrency on MariaDB
        run: python -m pytest tests/services/test_billing_p1i_numbering_mariadb.py -q
      - name: Concurrent payments settling one invoice on MariaDB
        run: python -m pytest tests/services/test_billing_p1i_settlement_mariadb.py -q
      - name: Credit applied to invoices under concurrency on MariaDB
        run: python -m pytest tests/services/test_billing_p1c_credit_mariadb.py -q
      - name: Core invoice status fixes under concurrency on MariaDB
        run: python -m pytest tests/services/test_billing_core_status_mariadb.py -q
      - name: Billing phase 2 chain on MariaDB
        run: python -m pytest tests/migrations/test_billing_p2_mariadb.py -q
      - name: Tax pack import against a concurrent publish on MariaDB
        run: python -m pytest tests/services/test_tax_pack_import_mariadb.py -q
      - name: Tax rule superseded during a publish on MariaDB
        run: python -m pytest tests/services/test_billing_p2_tax_publish_mariadb.py -q
      - name: Late fee job under concurrent runs and payments on MariaDB
        run: python -m pytest tests/services/test_billing_p2_late_fee_mariadb.py -q
      - name: Cancellation request racing invoice generation on MariaDB
        run: python -m pytest tests/services/test_billing_p2_cancel_mariadb.py -q
      - name: Billing job claims and leases under concurrency on MariaDB
        run: python -m pytest tests/services/test_billing_p2_job_claim_mariadb.py -q
      - name: Invoices generated ahead racing the at-due worker on MariaDB
        run: python -m pytest tests/services/test_billing_p2_generate_ahead_mariadb.py -q
      - name: Exchange rate deleted or stored during a publish on MariaDB
        run: python -m pytest tests/services/test_billing_p2_exchange_rates_mariadb.py -q
