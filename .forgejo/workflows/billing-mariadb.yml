# Optional: billing phase 1 migrations on MariaDB 11.8.
#
# Runs tests/core/test_alembic_fresh_mariadb.py (the whole Alembic chain,
# phase 1 included, from an empty database), tests/migrations/test_billing_p1_mariadb.py (up, down, up of the
# billing_p1_* chain), the snapshot isolation connect hook test and
# tests/services/test_billing_p1i_numbering_mariadb.py (series counters under
# concurrency) and tests/services/test_billing_p1i_settlement_mariadb.py (two
# payments settling one invoice at once) against a mariadb:11.8 service container, the version production
# runs. Manual trigger
# only, so it never blocks other work; the SQLite migration tests in
# tests/migrations run in the normal test suite.
name: Billing migrations (MariaDB)

on:
  workflow_dispatch:

jobs:
  mariadb:
    runs-on: docker
    container:
      image: python:3.11-bookworm
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rackflow-ci
          MARIADB_DATABASE: rackflow_test
    env:
      RACKFLOW_TEST_MARIADB_URL: mysql+pymysql://root:rackflow-ci@mariadb:3306/rackflow_test
      DATABASE_URL: sqlite:///:memory:
      INITIAL_ADMIN_USERNAME: ""
      INITIAL_ADMIN_PASSWORD: ""
      REQUIRE_SERVICE_INSTANCE_ENCRYPTION: "false"
      MCP_ENABLED: "false"
      CLIENT_MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for MariaDB
        run: |
          python - <<'EOF'
          import time, pymysql
          for _ in range(60):
              try:
                  pymysql.connect(host="mariadb", user="root", password="rackflow-ci").close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MariaDB did not start")
          EOF
      - name: Whole migration chain from an empty database on MariaDB
        run: python -m pytest tests/core/test_alembic_fresh_mariadb.py -q
      - name: Billing phase 1 chain on MariaDB
        run: python -m pytest tests/migrations/test_billing_p1_mariadb.py tests/core/test_database_snapshot_isolation.py -q
      - name: Series counters under concurrency on MariaDB
        run: python -m pytest tests/services/test_billing_p1i_numbering_mariadb.py -q
      - name: Concurrent payments settling one invoice on MariaDB
        run: python -m pytest tests/services/test_billing_p1i_settlement_mariadb.py -q
