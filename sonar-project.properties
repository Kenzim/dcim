sonar.projectKey=kenzim_dcim
sonar.projectName=dcim
sonar.sourceEncoding=UTF-8

sonar.sources=app,requirements.txt
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/uploads/**,**/disk_images/**,**/isos/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**

# OWASP Dependency-Check JSON is passed on the scanner CLI when the report exists
# (see .forgejo/workflows/sonarqube.yml). A missing path here hangs Community 26.6.
sonar.dependencyCheck.summarize=true
