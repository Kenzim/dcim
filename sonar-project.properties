sonar.projectKey=kenzim_dcim
sonar.projectName=dcim
sonar.sourceEncoding=UTF-8

sonar.sources=app,requirements.txt
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

