sonar.projectKey=kenzim_dcim
sonar.projectName=dcim
sonar.sourceEncoding=UTF-8

# Python + dependency manifests (plugin files issues onto lockfiles/requirements).
sonar.sources=app,requirements.txt,dhcp_runner/requirements.txt,tftp_runner/requirements.txt,frontend/package.json,frontend/package-lock.json,proxy_runner/go.mod,whmcs/composer.json
sonar.tests=tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/uploads/**,**/disk_images/**,**/isos/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**

# OWASP Dependency-Check → sonar-dependency-check-plugin 6.0.0.
# JSON is required for issues/metrics; HTML enables More → Dependency-Check.
# The Forgejo job fails if JSON is empty, so these paths exist at scan time
# (a missing jsonReportPath hangs Community 26.6).
sonar.dependencyCheck.jsonReportPath=dependency-check-report.json
sonar.dependencyCheck.summarize=true
sonar.dependencyCheck.htmlReportPath=dependency-check-report.html
