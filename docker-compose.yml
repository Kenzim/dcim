services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "10.16.251.240:8000:8000"
      - "192.168.10.171:8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STATIC_FILES_PATH: /app/static
      # Initial admin (only created when no users exist)
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_RETURN_BASE_URL: ${PAYPAL_RETURN_BASE_URL:-}
      RESELLER_TOPUP_MIN_CENTS: ${RESELLER_TOPUP_MIN_CENTS:-500}
      RESELLER_TOPUP_MAX_CENTS: ${RESELLER_TOPUP_MAX_CENTS:-1000000}
      RECURRING_BILLING_RETRY_DAYS: ${RECURRING_BILLING_RETRY_DAYS:-1,3,5}
      RECURRING_BILLING_GRACE_DAYS: ${RECURRING_BILLING_GRACE_DAYS:-7}
      RECURRING_BILLING_WORKER_INTERVAL_SECONDS: ${RECURRING_BILLING_WORKER_INTERVAL_SECONDS:-60}
      RECURRING_BILLING_WORKER_LEASE_SECONDS: ${RECURRING_BILLING_WORKER_LEASE_SECONDS:-300}
      RECURRING_BILLING_WORKER_BATCH_SIZE: ${RECURRING_BILLING_WORKER_BATCH_SIZE:-100}
      RUN_RECURRING_BILLING_WORKER: ${RUN_RECURRING_BILLING_WORKER:-false}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-30}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-120}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-100}
      RUN_NOTIFICATION_OUTBOX_WORKER: ${RUN_NOTIFICATION_OUTBOX_WORKER:-false}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      USDT_RPC_URL: ${USDT_RPC_URL:-}
      USDT_CHAIN_ID: ${USDT_CHAIN_ID:-}
      USDT_CONTRACT_ADDRESS: ${USDT_CONTRACT_ADDRESS:-}
      USDT_DECIMALS: ${USDT_DECIMALS:-6}
      USDT_CONFIRMATIONS: ${USDT_CONFIRMATIONS:-12}
      USDT_SCAN_INTERVAL_SECONDS: ${USDT_SCAN_INTERVAL_SECONDS:-15}
      USDT_SCAN_CHUNK_SIZE: ${USDT_SCAN_CHUNK_SIZE:-2000}
      USDT_INVOICE_EXPIRY_SECONDS: ${USDT_INVOICE_EXPIRY_SECONDS:-86400}
      USDT_HD_MNEMONIC_CIPHERTEXT: ${USDT_HD_MNEMONIC_CIPHERTEXT:-}
      USDT_FERNET_KEY: ${USDT_FERNET_KEY:-}
      USDT_TREASURY_ADDRESS: ${USDT_TREASURY_ADDRESS:-}
      USDT_GAS_WALLET_PRIVATE_KEY_CIPHERTEXT: ${USDT_GAS_WALLET_PRIVATE_KEY_CIPHERTEXT:-}
      USDT_GAS_RESERVE_WEI: ${USDT_GAS_RESERVE_WEI:-0}
      USDT_TOLERANCE_TOKEN_UNITS: ${USDT_TOLERANCE_TOKEN_UNITS:-0}
      USDT_RPC_TIMEOUT_SECONDS: ${USDT_RPC_TIMEOUT_SECONDS:-10}
      USDT_RPC_RETRIES: ${USDT_RPC_RETRIES:-2}
      USDT_REORG_RECHECK_BLOCKS: ${USDT_REORG_RECHECK_BLOCKS:-128}
      USDT_SWEEP_MAX_ATTEMPTS: ${USDT_SWEEP_MAX_ATTEMPTS:-5}
      USDT_WATCHER_LEASE_SECONDS: ${USDT_WATCHER_LEASE_SECONDS:-120}
      USDT_WATCHER_ENABLED: ${USDT_WATCHER_ENABLED:-false}
      RUN_USDT_WATCHER: ${RUN_USDT_WATCHER:-false}
      # Separate runner containers (optional; comment out to run in-app subprocesses)
      DHCP_RUNNER_URL: http://dhcp-runner:9080
      TFTP_RUNNER_URL: http://tftp-runner:9081
      DHCP_CONFIG_FILE_PATH: /shared/dhcp/dhcpd.conf
      DHCP_LEASE_FILE_PATH: /shared/dhcp/dhcpd.leases
      TFTP_ROOT_DIRECTORY: /shared/tftp
      # Encrypt per-location service-instance API keys at rest (required in prod).
      SERVICE_INSTANCE_ENCRYPTION_KEY: ${SERVICE_INSTANCE_ENCRYPTION_KEY:?set SERVICE_INSTANCE_ENCRYPTION_KEY in .env}
      REQUIRE_SERVICE_INSTANCE_ENCRYPTION: "true"
    volumes:
      - dhcp_tftp_shared:/shared
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  dhcp-runner:
    build:
      context: dhcp_runner
      dockerfile: Dockerfile
    environment:
      DHCP_CONFIG_PATH: /shared/dhcp/dhcpd.conf
      DHCP_LEASE_PATH: /shared/dhcp/dhcpd.leases
      DHCP_INTERFACES: ${DHCP_INTERFACES:-eth0}
      # Required: shared secret the app must present (per-instance API key).
      API_KEY: ${DHCP_RUNNER_API_KEY:?set DHCP_RUNNER_API_KEY in .env}
    volumes:
      - dhcp_tftp_shared:/shared
    ports:
      - "10.16.251.240:9080:9080"
      - "192.168.10.171:9080:9080"
    restart: unless-stopped

  tftp-runner:
    build:
      context: tftp_runner
      dockerfile: Dockerfile
    environment:
      TFTP_ROOT: /shared/tftp
      TFTP_BIND: 0.0.0.0:69
      # Required: shared secret the app must present (per-instance API key).
      API_KEY: ${TFTP_RUNNER_API_KEY:?set TFTP_RUNNER_API_KEY in .env}
    volumes:
      - dhcp_tftp_shared:/shared
    ports:
      - "10.16.251.240:9081:9081"
      - "192.168.10.171:9081:9081"
      - "10.16.251.240:69:69/udp"
      - "192.168.10.171:69:69/udp"
    restart: unless-stopped

  # Customer HTTP/SOCKS5 proxy forwarder. Host networking so customer bind IPs
  # on the host are connection LocalAddr (IPAM assignment identity).
  proxy-runner:
    build:
      context: proxy_runner
      dockerfile: Dockerfile
    network_mode: host
    environment:
      RACKFLOW_BASE_URL: ${RACKFLOW_BASE_URL}
      RUNNER_API_KEY: ${PROXY_RUNNER_API_KEY}
      SYNC_INTERVAL_SECONDS: ${PROXY_SYNC_INTERVAL_SECONDS:-10}
      PROXY_LISTEN: ${PROXY_LISTEN:-:8080}
      HEALTH_LISTEN: ${PROXY_HEALTH_LISTEN:-:8081}
    restart: unless-stopped

  # End-user IPMI reverse proxy edge. Serves *.ipmi.<base> and forwards to the
  # private BMC network after redeeming a one-time launch ticket for a session
  # cookie. Requires a route to the BMC management network.
  #
  # The runner speaks PLAIN HTTP; put a TLS terminator (Cloudflare, nginx,
  # Traefik, ...) in front for the wildcard *.ipmi.<base> cert. That terminator
  # must forward the X-Forwarded-Proto header so cookies are marked Secure and
  # absolute redirects are rewritten to https.
  ipmi-proxy-runner:
    build:
      context: ipmi_proxy_runner
      dockerfile: Dockerfile
    environment:
      RACKFLOW_BASE_URL: ${RACKFLOW_BASE_URL}
      RUNNER_API_KEY: ${IPMI_PROXY_RUNNER_API_KEY}
      IPMI_COOKIE_SECRET: ${IPMI_COOKIE_SECRET}
      IPMI_PUBLIC_BASE: ${IPMI_PROXY_PUBLIC_BASE}
      IPMI_SESSION_TTL_SECONDS: ${IPMI_SESSION_TTL_SECONDS:-7200}
      SYNC_INTERVAL_SECONDS: ${IPMI_SYNC_INTERVAL_SECONDS:-30}
      IPMI_UPSTREAM_VERIFY_TLS: ${IPMI_UPSTREAM_VERIFY_TLS:-0}
      PORT: "8080"
    ports:
      - "${IPMI_RUNNER_HTTP_PORT:-9082}:8080"
    restart: unless-stopped

  bandwidth-poller:
    build:
      context: .
      dockerfile: Dockerfile
      target: bandwidth-poller
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      POLL_INTERVAL: "60"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # VM deployment worker. Same image as `app`, but only claims and advances
  # deployment jobs (no HTTP). The API enqueues jobs; this container executes
  # them, so deploys survive API restarts/scaling. DB leases make it safe to
  # scale this to multiple replicas for failover.
  deployment-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "app.workers.deployment"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVICE_INSTANCE_ENCRYPTION_KEY: ${SERVICE_INSTANCE_ENCRYPTION_KEY:?set SERVICE_INSTANCE_ENCRYPTION_KEY in .env}
      DEPLOYMENT_WORKER_INTERVAL_SECONDS: ${DEPLOYMENT_WORKER_INTERVAL_SECONDS:-3}
      DEPLOYMENT_WORKER_LEASE_TTL_SECONDS: ${DEPLOYMENT_WORKER_LEASE_TTL_SECONDS:-60}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Non-custodial USDT chain watcher and treasury sweeper. Profile-gated so it
  # is not started by default: docker compose --profile usdt up -d usdt-watcher
  usdt-watcher:
    profiles: ["usdt"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "app.workers.usdt_watcher"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      USDT_RPC_URL: ${USDT_RPC_URL:-}
      USDT_CHAIN_ID: ${USDT_CHAIN_ID:-}
      USDT_CONTRACT_ADDRESS: ${USDT_CONTRACT_ADDRESS:-}
      USDT_DECIMALS: ${USDT_DECIMALS:-6}
      USDT_CONFIRMATIONS: ${USDT_CONFIRMATIONS:-12}
      USDT_SCAN_INTERVAL_SECONDS: ${USDT_SCAN_INTERVAL_SECONDS:-15}
      USDT_SCAN_CHUNK_SIZE: ${USDT_SCAN_CHUNK_SIZE:-2000}
      USDT_INVOICE_EXPIRY_SECONDS: ${USDT_INVOICE_EXPIRY_SECONDS:-86400}
      USDT_HD_MNEMONIC_CIPHERTEXT: ${USDT_HD_MNEMONIC_CIPHERTEXT:-}
      USDT_FERNET_KEY: ${USDT_FERNET_KEY:-}
      USDT_TREASURY_ADDRESS: ${USDT_TREASURY_ADDRESS:-}
      USDT_GAS_WALLET_PRIVATE_KEY_CIPHERTEXT: ${USDT_GAS_WALLET_PRIVATE_KEY_CIPHERTEXT:-}
      USDT_GAS_RESERVE_WEI: ${USDT_GAS_RESERVE_WEI:-0}
      USDT_TOLERANCE_TOKEN_UNITS: ${USDT_TOLERANCE_TOKEN_UNITS:-0}
      USDT_RPC_TIMEOUT_SECONDS: ${USDT_RPC_TIMEOUT_SECONDS:-10}
      USDT_RPC_RETRIES: ${USDT_RPC_RETRIES:-2}
      USDT_REORG_RECHECK_BLOCKS: ${USDT_REORG_RECHECK_BLOCKS:-128}
      USDT_SWEEP_MAX_ATTEMPTS: ${USDT_SWEEP_MAX_ATTEMPTS:-5}
      USDT_WATCHER_LEASE_SECONDS: ${USDT_WATCHER_LEASE_SECONDS:-120}
      USDT_WATCHER_ENABLED: ${USDT_WATCHER_ENABLED:-false}
      RUN_USDT_WATCHER: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Recurring reseller charges and dunning. Profile-gated so the API remains
  # enqueue/read-only by default and never duplicates this dedicated worker.
  recurring-billing-worker:
    profiles: ["billing"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "app.workers.recurring_billing"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      RECURRING_BILLING_RETRY_DAYS: ${RECURRING_BILLING_RETRY_DAYS:-1,3,5}
      RECURRING_BILLING_GRACE_DAYS: ${RECURRING_BILLING_GRACE_DAYS:-7}
      RECURRING_BILLING_WORKER_INTERVAL_SECONDS: ${RECURRING_BILLING_WORKER_INTERVAL_SECONDS:-60}
      RECURRING_BILLING_WORKER_LEASE_SECONDS: ${RECURRING_BILLING_WORKER_LEASE_SECONDS:-300}
      RECURRING_BILLING_WORKER_BATCH_SIZE: ${RECURRING_BILLING_WORKER_BATCH_SIZE:-100}
      RUN_RECURRING_BILLING_WORKER: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # SMTP outbox delivery is intentionally a separate retry loop.
  notification-worker:
    profiles: ["billing"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "app.workers.notification_outbox"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dcim}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-dcim}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-30}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-120}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-100}
      RUN_NOTIFICATION_OUTBOX_WORKER: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dcim}
      MYSQL_USER: ${MYSQL_USER:-dcim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql_data:
  dhcp_tftp_shared:
