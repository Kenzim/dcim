# Deploy DHCP and TFTP runners at a remote datacenter location.
# The central DCIM backend connects to these runners via base_url.
# Uses host networking like docker-compose.registry.yml. Example:
#   docker compose -f docker-compose.runners-only.yml up -d --build
services:
  dhcp-runner:
    build:
      context: dhcp_runner
      dockerfile: Dockerfile
    network_mode: host
    environment:
      DHCP_CONFIG_PATH: /shared/dhcp/dhcpd.conf
      DHCP_LEASE_PATH: /shared/dhcp/dhcpd.leases
      DHCP_INTERFACES: ${DHCP_INTERFACES:-eth0}
      # Required: shared secret the app must present (per-instance API key).
      API_KEY: ${DHCP_RUNNER_API_KEY:?set DHCP_RUNNER_API_KEY in .env}
    volumes:
      - dhcp_shared:/shared
    restart: unless-stopped

  tftp-runner:
    build:
      context: .
      dockerfile: tftp_runner/Dockerfile
    network_mode: host
    environment:
      TFTP_ROOT: /shared/tftp
      TFTP_BIND: 0.0.0.0:69
      # Required: shared secret the app must present (per-instance API key).
      API_KEY: ${TFTP_RUNNER_API_KEY:?set TFTP_RUNNER_API_KEY in .env}
    restart: unless-stopped

  proxy-runner:
    build:
      context: proxy_runner
      dockerfile: Dockerfile
    network_mode: host
    environment:
      RACKFLOW_BASE_URL: ${RACKFLOW_BASE_URL}
      RUNNER_API_KEY: ${PROXY_RUNNER_API_KEY}
      SYNC_INTERVAL_SECONDS: ${PROXY_SYNC_INTERVAL_SECONDS:-10}
    restart: unless-stopped

  # End-user IPMI reverse proxy edge (see docker-compose.yml for details).
  # host networking so it can reach the private BMC management network directly.
  # Serves PLAIN HTTP on IPMI_RUNNER_HTTP_PORT; a front TLS terminator adds https.
  ipmi-proxy-runner:
    build:
      context: ipmi_proxy_runner
      dockerfile: Dockerfile
    network_mode: host
    environment:
      RACKFLOW_BASE_URL: ${RACKFLOW_BASE_URL}
      RUNNER_API_KEY: ${IPMI_PROXY_RUNNER_API_KEY}
      IPMI_COOKIE_SECRET: ${IPMI_COOKIE_SECRET}
      IPMI_PUBLIC_BASE: ${IPMI_PROXY_PUBLIC_BASE}
      IPMI_SESSION_TTL_SECONDS: ${IPMI_SESSION_TTL_SECONDS:-1800}
      SYNC_INTERVAL_SECONDS: ${IPMI_SYNC_INTERVAL_SECONDS:-30}
      IPMI_UPSTREAM_VERIFY_TLS: ${IPMI_UPSTREAM_VERIFY_TLS:-0}
      PORT: ${IPMI_RUNNER_HTTP_PORT:-9082}
    restart: unless-stopped

volumes:
  dhcp_shared:
